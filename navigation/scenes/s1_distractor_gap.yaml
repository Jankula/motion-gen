  - {id: table_1, label: table, color: burlywood, center: [2.0, 1.2, 0.375], size: [1.2, 0.8, 0.75]}
  - {id: mug_1, label: mug, color: blue, center: [2.0, 1.2, 0.8], size: [0.1, 0.1, 0.1]}
  - {id: table_2, label: table, color: burlywood, center: [6.5, 4.5, 0.375], size: [1.2, 0.8, 0.75]}
  - {id: mug_2, label: mug, color: red, center: [6.5, 4.5, 0.8], size: [0.1, 0.1, 0.1]}
